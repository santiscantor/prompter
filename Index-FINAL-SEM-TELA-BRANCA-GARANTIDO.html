<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompter Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f6f7fb;color:#111}
.header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 16px;position:sticky;top:0;z-index:10}
.header h1{font-size:18px;font-weight:900}
.header p{font-size:11px;color:#6b7280;margin-top:2px}
.btn{border:none;border-radius:100px;padding:12px 18px;font-weight:800;font-size:13px;cursor:pointer}
.btn-blue{background:#2f5bff;color:#fff}
.btn-black{background:#111;color:#fff}
.btn-white{background:#fff;border:1px solid #e5e7eb;color:#111}
.search{width:100%;margin-top:12px;padding:12px 16px;border-radius:100px;border:1px solid #e5e7eb;background:#f3f4f6;font-size:14px;outline:none}
.import-box{background:#fff;border:2px solid #2f5bff;border-radius:16px;padding:16px;margin:12px}
.card{background:#fff;border-radius:16px;padding:14px 16px;margin:0 12px 10px 12px;border:1px solid #eee;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.card b{font-size:14px}
.card small{color:#6b7280;font-size:11px}
.bar{background:#2f5bff;color:#fff;font-weight:800;font-size:11px;padding:6px 12px;border-radius:6px;margin:18px 0 8px;letter-spacing:.5px}
.chord{font-weight:800;background:#eef2ff;color:#2f5bff;padding:1px 6px;border-radius:6px;font-family:monospace}
.cifra{font-family:monospace;white-space:pre-wrap;line-height:2.2;font-size:13px}
.song-view{background:#fff;min-height:100vh;display:none}
.song-header{background:#fff;border-bottom:1px solid #eee;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0}
.tag{background:#eef2ff;color:#2f5bff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:100px;margin-right:4px}
#status{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;display:none}
</style>
</head>
<body>

<div id="main">
<div class="header">
<h1>Minhas Setlists</h1>
<p>smartcifra clone • igual ao vídeo que você mandou</p>
<button class="btn btn-blue" style="margin-top:12px;width:100%" onclick="toggleImport()">📥 IMPORTAR DO CIFRA CLUB</button>
<input id="search" class="search" placeholder="Buscar música..." oninput="filterSongs()">
</div>

<div id="importBox" class="import-box" style="display:none">
<b>📥 Importar do Cifra Club</b><br>
<small style="color:#6b7280">Ex: https://www.cifraclub.com/felipe-rodrigues/tudo-e-perda/</small><br><br>
<input id="urlInput" placeholder="Cole o link aqui..." style="width:100%;padding:12px;border-radius:100px;border:2px solid #ddd"><br><br>
<button class="btn btn-blue" style="width:100%" onclick="doImport()">Importar cifra</button>
<div id="status"></div>
<hr style="margin:16px 0;border:none;border-top:2px dashed #eee">
<b style="font-size:13px">Ou cole a cifra manualmente (funciona 100%)</b><br>
<textarea id="manual" rows="6" placeholder="Abra o Cifra Club, copie tudo (Ctrl+A, Ctrl+C) e cole aqui..." style="width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid #ddd;font-family:monospace;font-size:12px"></textarea><br>
<button class="btn btn-black" style="width:100%;margin-top:8px" onclick="importManual()">Salvar cifra colada</button>
</div>

<div id="list" style="padding-top:12px"></div>

<div style="padding:20px;text-align:center;color:#9ca3af;font-size:11px;margin-bottom:60px">
Prompter Pro • Igual ao vídeo • Import Cifra Club • Modo Banda
</div>
</div>

<div id="songView" class="song-view">
<div class="song-header">
<button class="btn btn-blue" onclick="back()" style="padding:8px 14px;font-size:12px">← Voltar</button>
<div><b id="songTitle" style="font-size:14px"></b><br><small id="songArtist" style="color:#6b7280;font-size:11px"></small></div>
</div>
<div style="padding:6px 16px;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid #f3f4f6">
<span class="tag">C</span><span class="tag">Am</span><span class="tag">C/G</span><span class="tag">F7M</span><span class="tag" style="background:#f3f4f6;color:#6b7280">VERSO 1</span>
</div>
<div style="padding:20px"><div id="songContent" class="cifra"></div></div>
</div>

<script>
var songs = [];
try{ songs = JSON.parse(localStorage.getItem('prompter_final')||'[]'); }catch(e){ songs=[]; }
if(songs.length===0){
songs=[
{id:1,title:'Tudo É Perda',artist:'Felipe Rodrigues',cifra:"C  Am  C/G  F7M

[VERSO 1]
C                Am7
Tudo é perda se não tenho a Ti
G                  F
A Tua graça é o que me basta
C                Am7
Sem Você, não sei pra onde ir
G                  F
Sem Tua presença, nada importa

[PRE-REFRÃO]
F
Do que adianta eu
G
Ganhar o mundo inteiro
C/E      F
Se a minha alma se perder"},
{id:2,title:'Somos Um',artist:'Salatiel',cifra:"G  D  Em  C

[INTRO]
G  D  Em  C

[VERSO 1]
G               D
Somos um em Cristo Jesus"},
{id:3,title:'Vou Te Alegrar',artist:'Aline Barros',cifra:"B4  C#m7  A9

[VERSO 1]
B4
Quando em Ti ponho os olhos"},
{id:4,title:'Bondade de Deus',artist:'IBAB',cifra:"G  C  D

[VERSO 1]
G
Te amo Deus"}
];
localStorage.setItem('prompter_final', JSON.stringify(songs));
}
function save(){ localStorage.setItem('prompter_final', JSON.stringify(songs)); }
function render(){
var html='';
for(var i=0;i<songs.length;i++){
var s=songs[i];
html+='<div class="card" onclick="openSong('+s.id+')"><div><b>'+s.title+'</b><br><small>'+s.artist+'</small></div><div>🎸</div></div>';
}
document.getElementById('list').innerHTML=html;
}
function openSong(id){
var s=null;
for(var i=0;i<songs.length;i++){ if(songs[i].id===id){ s=songs[i]; break; } }
if(!s) return;
document.getElementById('songTitle').textContent=s.title;
document.getElementById('songArtist').textContent=s.artist+' • Tom: C';
var content=s.cifra.replace(/\[([^\]]+)\]/g,function(a,b){ return '<div class="bar">'+b+'</div>'; });
content=content.replace(/\b([A-G][#b]?m?7?M?)\b/g,'<span class="chord">$1</span>');
document.getElementById('songContent').innerHTML=content;
document.getElementById('main').style.display='none';
document.getElementById('songView').style.display='block';
window.scrollTo(0,0);
}
function back(){
document.getElementById('songView').style.display='none';
document.getElementById('main').style.display='block';
}
function toggleImport(){
var b=document.getElementById('importBox');
b.style.display=(b.style.display==='none'?'block':'none');
}
function filterSongs(){
var q=document.getElementById('search').value.toLowerCase();
var filtered=[];
for(var i=0;i<songs.length;i++){
if(songs[i].title.toLowerCase().indexOf(q)>-1 || songs[i].artist.toLowerCase().indexOf(q)>-1) filtered.push(songs[i]);
}
var html='';
for(var i=0;i<filtered.length;i++){
var s=filtered[i];
html+='<div class="card" onclick="openSong('+s.id+')"><div><b>'+s.title+'</b><br><small>'+s.artist+'</small></div><div>🎸</div></div>';
}
document.getElementById('list').innerHTML=html;
}
function doImport(){
var url=document.getElementById('urlInput').value.trim();
var st=document.getElementById('status');
if(!url){ alert('Cole o link do Cifra Club'); return; }
st.style.display='block';
st.style.background='#fef3c7';
st.innerHTML='⏳ Tentando buscar... Se bloquear, use colar manual abaixo (funciona 100%)';
fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url)).then(function(r){ return r.text(); }).then(function(html){
var doc=new DOMParser().parseFromString(html,'text/html');
var titleEl=doc.querySelector('h1');
var title=titleEl?titleEl.innerText:'Música importada';
var pre=doc.querySelector('pre');
var cifra=pre?pre.innerText:'';
if(!cifra || cifra.length<20){
st.style.background='#fee2e2';
st.innerHTML='❌ Cifra Club bloqueou. Copie manualmente do site e cole abaixo - funciona 100%';
return;
}
var newSong={id:Date.now(),title:title.substring(0,60),artist:'Cifra Club',cifra:cifra.substring(0,15000)};
songs.unshift(newSong);
save();
render();
st.style.background='#dcfce7';
st.innerHTML='✅ Importado! '+title;
setTimeout(function(){ openSong(newSong.id); },800);
}).catch(function(e){
st.style.background='#fee2e2';
st.innerHTML='❌ Bloqueado pelo Cifra Club. Use colar manual abaixo - copie do site e cole.';
});
}
function importManual(){
var txt=document.getElementById('manual').value.trim();
if(txt.length<10){ alert('Cole a cifra primeiro'); return; }
var newSong={id:Date.now(),title:'Importada - '+new Date().toLocaleDateString(),artist:'Cifra Club',cifra:txt};
songs.unshift(newSong);
save();
render();
document.getElementById('importBox').style.display='none';
document.getElementById('manual').value='';
openSong(newSong.id);
}
render();
</script>
</body>
</html>
