<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompter Pro - Novo App</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{ -webkit-tap-highlight-color:transparent }
body{font-family:'Inter',sans-serif;background:#f6f7fb;overscroll-behavior:none}
.cifra{font-family:'JetBrains Mono',monospace;white-space:pre-wrap;line-height:2.1;font-size:13px}
.chord{font-weight:800;color:#111827;cursor:pointer;padding:1px 4px;border-radius:6px}
.chord:hover{background:#e0e7ff;color:#4338ca}
.section-bar{background:#2f5bff;color:white;font-weight:800;font-size:11px;letter-spacing:.9px;padding:7px 14px;border-radius:8px;margin:22px 0 12px;text-transform:uppercase}
</style>
</head>
<body>
<div id="app"></div>
<script>
let songs = JSON.parse(localStorage.getItem('prompter_novo_songs')||'[]');
let curSong=null, showImport=false, importUrl='', importStatus='', importLoading=false, showChordModal=null;
let bandaAtiva=false, bandaSala=null, bandaIsLeader=false, bandaChannel=null;

const initialSongs = [
{id:1,title:'Tudo É Perda',artist:'Felipe Rodrigues',key:'C',cifra:`C  Am  C/G  F7M

[VERSO 1]
C                Am7
Tudo é perda se não tenho a Ti
G                  F
A Tua graça é o que me basta
C                Am7
Sem Você, não sei pra onde ir
G                  F
Sem Tua presença, nada importa

[PRE-REFRÃO]
F
Do que adianta eu
G
Ganhar o mundo inteiro
C/E      F
Se a minha alma se perder

[REFRÃO]
C/E              F
Do que adianta eu
G                Am7
Ganhar o mundo inteiro
F                G
Se eu Te perder`},
{id:2,title:'Somos Um',artist:'Salatiel',key:'G',cifra:`G  D  Em  C

[INTRO]
G  D  Em  C

[VERSO 1]
G               D
Somos um em Cristo Jesus
Em              C
Unidos pelo seu amor`},
{id:3,title:'Vou Te Alegrar',artist:'Aline Barros',key:'B4',cifra:`B4  C#m7  A9  E

[VERSO 1]
B4
Quando em Ti ponho os olhos
C#m7           A9
Percebo o quanto me amas`},
{id:4,title:'Bondade de Deus',artist:'IBAB Celebração',key:'G',cifra:`G  C  D

[VERSO 1]
G
Te amo Deus
C
Tua graça nunca falha`}
];

if(songs.length===0){ songs=initialSongs; localStorage.setItem('prompter_novo_songs',JSON.stringify(songs)); }

function render(){
  const app=document.getElementById('app');
  
  if(showChordModal){
    app.innerHTML = `<div class="fixed inset-0 bg-black/60 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target==this){showChordModal=null;render()}">
      <div class="bg-white w-full sm:max-w-[360px] rounded-t-[24px] sm:rounded-[20px] p-6">
        <div class="flex justify-between items-center mb-5"><h3 class="text-[32px] font-black tracking-tight">${showChordModal}</h3><button onclick="showChordModal=null;render()" class="w-10 h-10 bg-gray-100 rounded-full font-bold">✕</button></div>
        <div class="bg-[#f8fafc] rounded-[16px] p-5 mb-5"><div class="flex justify-between text-[10px] font-bold text-gray-400 mb-3"><span>VIOLÃO</span><span>TECLADO</span><span>CAVACO</span></div><div class="flex justify-center gap-6"><div class="text-center"><div class="w-28 h-20 bg-white border-2 border-gray-200 rounded-xl flex items-center justify-center font-mono text-sm">🎸<br>${showChordModal}</div><div class="mt-2 text-[10px]">E A D G B E<br>● ○ ○ ○ ○ ○</div></div><div class="text-center"><div class="w-28 h-20 bg-white border-2 border-gray-200 rounded-xl flex items-center justify-center">🎹<br>${showChordModal}</div><div class="mt-2 text-[10px]">C E G<br>Notas</div></div></div></div>
        <button class="w-full bg-[#2f5bff] text-white font-bold py-4 rounded-full">Ver detalhes completos</button>
        <div class="mt-4 p-4 bg-[#eef2ff] rounded-[12px] text-[12px] leading-relaxed"><b class="text-[#2f5bff]">Contexto harmônico:</b> Acorde ${showChordModal} na tonalidade de C maior. ${showChordModal.includes('m')?'Menor - transmite emoção e introspecção.':'Maior - transmite alegria e resolução.'}</div>
      </div>
    </div>`;
    return;
  }
  
  if(showImport){
    app.innerHTML = `<div class="min-h-screen bg-[#f6f7fb]"><div class="bg-white border-b p-4 flex items-center gap-3 sticky top-0 z-20"><button onclick="showImport=false;render()" class="bg-[#2f5bff] text-white text-[13px] font-bold px-5 py-2.5 rounded-full">← Voltar</button><h1 class="font-extrabold text-[17px]">📥 Importar do Cifra Club</h1></div>
      <div class="p-4 max-w-[640px] mx-auto">
        <div class="bg-white rounded-[20px] p-6 shadow-sm border">
          <div class="flex items-center gap-2 mb-2"><span class="bg-[#2f5bff] text-white text-[10px] font-bold px-2 py-1 rounded-full">NOVO</span><h2 class="font-extrabold text-[15px]">Cole o link da música do Cifra Club</h2></div>
          <p class="text-[12px] text-gray-500 mb-4">Ex: https://www.cifraclub.com/felipe-rodrigues/tudo-e-perda/</p>
          <div class="flex gap-2"><input id="urlInput" value="${importUrl}" placeholder="https://www.cifraclub.com/..." class="flex-1 border-2 border-gray-200 rounded-full px-5 py-3.5 text-[14px] focus:border-[#2f5bff] outline-none"><button onclick="doImport()" class="bg-[#2f5bff] text-white font-bold px-7 py-3.5 rounded-full text-[14px] whitespace-nowrap">${importLoading?'Importando...':'Importar'}</button></div>
          ${importStatus?`<div class="mt-4 p-4 rounded-[14px] text-[13px] leading-relaxed ${importStatus.includes('✅')?'bg-green-50 border-2 border-green-200':'bg-amber-50 border-2 border-amber-200'}">${importStatus}</div>`:''}
          <div class="mt-8 pt-6 border-t-2 border-dashed border-gray-200"><p class="text-[13px] font-bold mb-3">Ou cole a cifra manualmente (funciona 100% sempre):</p><textarea id="manualPaste" rows="8" placeholder="Abra o Cifra Club, selecione toda a cifra (Ctrl+A), copie (Ctrl+C) e cole aqui..." class="w-full border-2 border-gray-200 rounded-[16px] p-4 text-[12px] font-mono focus:border-[#2f5bff] outline-none"></textarea><button onclick="importManual()" class="mt-3 w-full bg-black text-white font-bold py-4 rounded-full text-[14px]">📋 Colar cifra manualmente e salvar</button></div>
        </div>
      </div>
    </div>`;
    setTimeout(()=>{const el=document.getElementById('urlInput');if(el)el.focus();},100);
    return;
  }

  if(curSong){
    app.innerHTML = `<div class="min-h-screen bg-white"><div class="sticky top-0 bg-white border-b z-20"><div class="flex items-center justify-between p-3"><div class="flex items-center gap-3"><button onclick="curSong=null;render()" class="bg-[#2f5bff] text-white text-[12px] font-bold px-4 py-2 rounded-full">← Voltar</button><div><div class="font-extrabold text-[15px] leading-tight">${curSong.title}</div><div class="text-[11px] text-gray-500">${curSong.artist} • Tom: ${curSong.key} • Terça-feira, 29 de setembro</div></div></div><div class="flex items-center gap-1"><button class="w-8 h-8 bg-[#2f5bff] text-white rounded-full text-[12px] flex items-center justify-center">▶</button><button class="w-8 h-8 bg-gray-100 rounded-full text-[12px]">⭐</button><button class="w-8 h-8 bg-gray-100 rounded-full text-[12px]">✏️</button><button class="w-8 h-8 bg-gray-100 rounded-full text-[12px]">T</button><button class="w-8 h-8 bg-gray-100 rounded-full text-[12px]">C</button><button class="w-8 h-8 bg-gray-100 rounded-full text-[12px]">↗</button><button class="w-8 h-8 bg-gray-100 rounded-full text-[12px]">🔄</button></div></div><div class="px-3 pb-3 flex gap-1.5 overflow-x-auto"><span class="bg-[#eef2ff] text-[#2f5bff] text-[11px] font-bold px-2.5 py-1.5 rounded-full">C</span><span class="bg-[#eef2ff] text-[#2f5bff] text-[11px] font-bold px-2.5 py-1.5 rounded-full">Am</span><span class="bg-[#eef2ff] text-[#2f5bff] text-[11px] font-bold px-2.5 py-1.5 rounded-full">C/G</span><span class="bg-[#eef2ff] text-[#2f5bff] text-[11px] font-bold px-2.5 py-1.5 rounded-full">F7M</span><span class="bg-gray-100 text-[11px] font-bold px-2.5 py-1.5 rounded-full">VERSO 1</span></div></div><div class="p-5 max-w-[700px] mx-auto"><div class="cifra" id="cifraContent">${formatCifra(curSong.cifra)}</div><div class="mt-10 p-4 bg-[#f8fafc] border rounded-[16px] flex items-center gap-3"><button class="bg-black text-white text-[12px] font-bold px-5 py-2.5 rounded-full">▶ 00:08</button><div class="flex-1 h-2 bg-gray-200 rounded-full"><div class="w-[35%] h-2 bg-[#2f5bff] rounded-full"></div></div><span class="text-[11px] text-gray-500 font-mono">00:08 / 03:42</span></div></div><button class="fixed bottom-6 right-6 w-14 h-14 bg-[#2f5bff] text-white rounded-full shadow-xl flex items-center justify-center text-[18px]">🔍</button></div>`;
    return;
  }

  app.innerHTML = `<div class="min-h-screen bg-[#f6f7fb]"><div class="bg-white border-b sticky top-0 z-20"><div class="p-4 flex items-center justify-between"><div><h1 class="font-extrabold text-[20px] tracking-tight">Minhas Setlists</h1><p class="text-[11px] text-gray-500 -mt-1">smartcifra • Terça-feira, 29 de setembro</p></div><button onclick="toggleBanda()" class="bg-[#7c3aed] text-white text-[11px] font-bold px-4 py-2 rounded-full">🎸 ${bandaAtiva?'🟢 Banda '+bandaSala:'Modo Banda'}</button></div><div class="px-4 pb-4 flex gap-2"><input id="searchInput" placeholder="Buscar cifra ou setlist..." class="flex-1 bg-[#f3f4f6] rounded-full px-5 py-3 text-[14px] outline-none"><button onclick="showImport=true;render()" class="bg-[#2f5bff] text-white font-bold px-5 py-3 rounded-full text-[13px] whitespace-nowrap">📥 Importar</button><button class="bg-black text-white font-bold w-10 h-10 rounded-full text-[18px]">+</button></div></div>
  <div class="p-4 max-w-[700px] mx-auto"><div class="bg-gradient-to-br from-[#2f5bff] to-[#7c3aed] rounded-[20px] p-5 mb-5 text-white flex items-center justify-between"><div><div class="font-extrabold text-[16px]">📥 Importar do Cifra Club</div><div class="text-[12px] opacity-90 mt-1">Cole o link e a cifra vem completa</div></div><button onclick="showImport=true;render()" class="bg-white text-[#2f5bff] font-extrabold text-[13px] px-6 py-3 rounded-full">Importar</button></div>
  <div class="flex items-center justify-between mb-3"><h2 class="font-bold text-[15px]">Grupo B - UPG • ${songs.length} músicas</h2><button class="text-[12px] text-[#2f5bff] font-bold">Buscar cifra na setlist...</button></div>
  <div class="text-[11px] font-bold text-gray-400 mb-2 tracking-widest">SUB SETLISTS</div>
  <div class="bg-white rounded-[16px] border p-4 flex items-center justify-between mb-4"><div><div class="font-bold text-[14px]">Repertório Geral do Grupo</div><div class="text-[11px] text-gray-500">8 músicas</div></div><span class="text-gray-400">›</span></div>
  <div class="space-y-2.5">${songs.map((s,i)=>`<div class="bg-white rounded-[16px] p-4 border border-gray-100 flex items-center justify-between cursor-pointer hover:shadow-md transition-all" onclick="curSong=songs.find(x=>x.id==${s.id});render()"><div class="flex gap-3 items-center"><span class="text-[11px] font-bold text-gray-400 w-4">${i+1}</span><div><div class="font-bold text-[14px]">${s.title}</div><div class="text-[11px] text-gray-500">${s.artist} • ${s.key}</div></div></div><div class="flex gap-1.5"><span class="w-8 h-8 bg-[#f3f4f6] rounded-full flex items-center justify-center text-[13px]">🎸</span><span class="w-8 h-8 bg-[#f3f4f6] rounded-full flex items-center justify-center text-[13px]">📄</span><span class="w-8 h-8 bg-[#f3f4f6] rounded-full flex items-center justify-center text-[13px]">⋯</span></div></div>`).join('')}</div>
  <div class="mt-8 p-4 bg-white rounded-[16px] border text-[12px]"><b>💡 Modo Banda em tempo real:</b> Clique em Modo Banda > Compartilhe o link > Seus músicos veem o que você vê ao vivo, igual no vídeo.</div>
  </div>
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-3 text-[10px] font-bold text-gray-400"><span class="text-[#2f5bff]">📄 Setlists</span><span>➕ Criar</span><span>🔍 Busca</span><span>👤 Perfil</span></div>
  </div>`;
}

function formatCifra(text){
  return text.split('\n').map(line=>{
    if(line.trim().startsWith('[')){ const clean=line.replace(/\[|\]/g,'').trim(); return `<div class="section-bar">${clean}</div>`; }
    return line.replace(/\b([A-G][#b]?m?(?:maj|min|dim|aug|sus|add)?[0-9]?(?:/[A-G][#b]?)?)\b/g, m=>`<span class="chord" onclick="event.stopPropagation();showChordModal='${m}';render()">${m}</span>`);
  }).join('\n');
}

async function doImport(){
  const input=document.getElementById('urlInput');
  const url=input?input.value.trim():importUrl;
  if(!url){alert('Cole o link do Cifra Club\nEx: https://www.cifraclub.com/felipe-rodrigues/tudo-e-perda/');return;}
  importUrl=url; importLoading=true; importStatus='⏳ Buscando cifra no Cifra Club...'; render();
  try{
    let htmlText='';
    try{ const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url)); if(r.ok) htmlText=await r.text(); }catch(e){}
    if(!htmlText || htmlText.length<400){ try{ const r2=await fetch('https://corsproxy.io/?'+encodeURIComponent(url)); if(r2.ok) htmlText=await r2.text(); }catch(e){} }
    if(!htmlText) throw new Error('Cifra Club bloqueou. Use colar manual abaixo.');
    const doc=new DOMParser().parseFromString(htmlText,'text/html');
    let title=doc.querySelector('h1')?.innerText?.trim() || doc.querySelector('title')?.innerText?.split('-')[0]?.trim() || 'Música importada';
    let artist=doc.querySelector('.cifra_header h2 a')?.innerText || '';
    let cifra=''; const pre=doc.querySelector('pre'); if(pre){ cifra=pre.innerHTML.replace(/<br[^>]*>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').trim(); }
    if(!cifra || cifra.length<20){ cifra=doc.querySelector('#cifra')?.innerText || ''; }
    if(!cifra || cifra.length<30) throw new Error('Não achei a cifra. Copie manualmente.');
    const newSong={id:Date.now(),title:title.substring(0,70),artist:artist.substring(0,40)||'Importado do Cifra Club',key:'C',cifra:cifra.substring(0,15000)};
    songs.unshift(newSong); localStorage.setItem('prompter_novo_songs',JSON.stringify(songs));
    importStatus='✅ <b>Importado!</b> '+title+'<br>Salva em Minhas Cifras.'; importLoading=false; render();
    setTimeout(()=>{ showImport=false; curSong=newSong; render(); },1400);
  }catch(e){ importLoading=false; importStatus='❌ '+e.message+'<br>Use colar manual abaixo - funciona 100%.'; render(); }
}
function importManual(){
  const ta=document.getElementById('manualPaste'); const txt=ta?ta.value.trim():'';
  if(!txt || txt.length<20){alert('Cole a cifra primeiro');return;}
  const newSong={id:Date.now(),title:'Importada - '+new Date().toLocaleDateString(),artist:'Cifra Club',key:'C',cifra:txt.substring(0,15000)};
  songs.unshift(newSong); localStorage.setItem('prompter_novo_songs',JSON.stringify(songs)); showImport=false; curSong=newSong; render();
}

function toggleBanda(){
  if(!bandaAtiva){
    const codigo=Math.random().toString(36).substring(2,6).toUpperCase();
    bandaSala=codigo; bandaAtiva=true; bandaIsLeader=true;
    const link=location.origin+location.pathname+'?banda='+codigo;
    const modal=document.createElement('div');
    modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
    modal.innerHTML=`<div style="background:white;border-radius:24px;padding:28px;max-width:400px;width:100%;text-align:center"><div style="font-size:40px">🎸</div><h2 style="font-weight:900;font-size:20px;margin:10px 0">Modo Banda Ativo</h2><p style="font-size:13px;color:#6b7280">Seus músicos veem o que você vê em tempo real</p><div style="background:#f3f4f6;border-radius:16px;padding:16px;margin:16px 0"><div style="font-size:10px;color:#9ca3af;letter-spacing:1px;font-weight:800">CÓDIGO DA SALA</div><div style="font-size:32px;font-weight:900;letter-spacing:6px;color:#2f5bff;margin:6px 0">${codigo}</div><div style="font-size:11px;color:#6b7280;word-break:break-all">${link}</div></div><div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px;text-align:left;font-size:12px;line-height:1.6"><b>Como usar:</b><br>1. Mande o link no grupo da banda<br>2. Músicos abrem e entram na sala ${codigo}<br>3. Quando você troca de música, todos veem igual</div><div style="display:flex;gap:10px;margin-top:16px"><button onclick="navigator.clipboard.writeText('${link}');this.textContent='Copiado!'" style="flex:1;background:#2f5bff;color:white;border:none;padding:14px;border-radius:100px;font-weight:800">📋 Copiar Link</button><button onclick="this.closest('div').parentElement.remove()" style="flex:1;background:black;color:white;border:none;padding:14px;border-radius:100px;font-weight:800">Começar</button></div></div>`;
    document.body.appendChild(modal);
    bandaChannel=new BroadcastChannel('prompter_banda_'+codigo);
    bandaChannel.onmessage=(e)=>{};
  } else {
    bandaAtiva=false; bandaSala=null; bandaIsLeader=false;
    if(bandaChannel) bandaChannel.close();
    render();
  }
}

render();
</script>
</body>
</html>
